<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORBIT — Open-ended Reasoning & Behavior Intelligence for Simulation and Testing</title>
    <meta
      name="description"
      content="Imagine it. Simulate it. Understand what happens. Transform natural-language descriptions into validated, deterministic Python mathematical simulations."
    />
    <meta
      property="og:title"
      content="ORBIT — AI-Assisted Scientific Simulation Platform"
    />
    <meta
      property="og:description"
      content="Imagine it. Simulate it. Understand what happens. Deterministic system-dynamics simulation with structured AI modeling and evidence-grounded analysis."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("orbit_theme");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
